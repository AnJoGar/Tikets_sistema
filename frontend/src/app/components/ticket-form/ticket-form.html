<form [formGroup]="ticketForm" (ngSubmit)="onSubmit()" class="ticket-form">
    <div class="form-group">
        <label>Título</label>
        <input type="text" formControlName="title" class="form-control"
            [class.is-invalid]="submitted && f['title'].errors" placeholder="Ingresa el título del ticket">
        <div *ngIf="submitted && f['title'].errors" class="invalid-feedback">
            <div *ngIf="f['title'].errors['required']">Título es requerido</div>
            <div *ngIf="f['title'].errors['minlength']">Mínimo 5 caracteres</div>
        </div>
    </div>

    <div class="form-group">
        <label>Descripción</label>
        <textarea formControlName="description" class="form-control" rows="4"
            [class.is-invalid]="submitted && f['description'].errors"
            placeholder="Describe el problema en detalle"></textarea>
        <div *ngIf="submitted && f['description'].errors" class="invalid-feedback">
            <div *ngIf="f['description'].errors['required']">Descripción es requerida</div>
            <div *ngIf="f['description'].errors['minlength']">Mínimo 10 caracteres</div>
        </div>
    </div>

    <div class="form-group">
        <label>Prioridad</label>
        <select formControlName="priority" class="form-control">
            <option value="LOW">Baja</option>
            <option value="MEDIUM">Media</option>
            <option value="HIGH">Alta</option>
        </select>
    </div>

    <button type="submit" class="btn btn-primary">Crear Ticket</button>
</form>
