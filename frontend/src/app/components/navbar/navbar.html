<nav class="navbar">
    <div class="navbar-container">
        <a routerLink="/dashboard" class="navbar-brand">
            <span class="logo">🎫</span>
            Tickets
        </a>

        <button class="menu-toggle" (click)="toggleMenu()">
            ☰
        </button>

        <div class="navbar-menu" [class.active]="isMenuOpen">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a routerLink="/dashboard" routerLinkActive="active">
                    </a>
                </li>
                <li class="nav-item">
                    <a routerLink="/tickets" routerLinkActive="active">
                        Tickets
                    </a>
                </li>
            </ul>

            <div class="navbar-user" *ngIf="currentUser$ | async as user">
                <span class="user-name">{{ user.name }}</span>
                <button class="btn-logout" (click)="logout()">
                    Logout
                </button>
            </div>

            <div class="navbar-auth" *ngIf="!(currentUser$ | async)">
                <a routerLink="/login" class="btn btn-login">Login</a>
                <a routerLink="/register" class="btn btn-register">Registro</a>
            </div>
        </div>
    </div>
</nav>
