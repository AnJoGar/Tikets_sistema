<div class="register-container">
    <div class="register-card">
        <h1>Registro</h1>

        <div *ngIf="error" class="alert alert-danger">
            {{ error }}
        </div>

        <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
            <div class="form-group">
                <label>Nombre</label>
                <input type="text" formControlName="name" class="form-control"
                    [class.is-invalid]="submitted && f['name'].errors">
                <div *ngIf="submitted && f['name'].errors" class="invalid-feedback">
                    <div *ngIf="f['name'].errors['required']">Nombre es requerido</div>
                    <div *ngIf="f['name'].errors['minlength']">Mínimo 2 caracteres</div>
                </div>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" formControlName="email" class="form-control"
                    [class.is-invalid]="submitted && f['email'].errors">
                <div *ngIf="submitted && f['email'].errors" class="invalid-feedback">
                    <div *ngIf="f['email'].errors['required']">Email es requerido</div>
                    <div *ngIf="f['email'].errors['email']">Email inválido</div>
                </div>
            </div>

            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" formControlName="password" class="form-control"
                    [class.is-invalid]="submitted && f['password'].errors">
                <div *ngIf="submitted && f['password'].errors" class="invalid-feedback">
                    <div *ngIf="f['password'].errors['required']">Contraseña es requerida</div>
                    <div *ngIf="f['password'].errors['minlength']">Mínimo 8 caracteres</div>
                </div>
            </div>

            <div class="form-group">
                <label>Perfil</label>
                <select formControlName="profileId" class="form-control"
                    [class.is-invalid]="submitted && f['profileId'].errors">
                    <option value="">Selecciona un perfil</option>
                    <option *ngFor="let profile of profiles" [value]="profile.id">
                        {{ profile.name }}
                    </option>
                </select>
                <div *ngIf="submitted && f['profileId'].errors" class="invalid-feedback">
                    <div *ngIf="f['profileId'].errors['required']">Perfil es requerido</div>
                </div>
            </div>

            <button type="submit" class="btn btn-primary" [disabled]="loading">
                {{ loading ? 'Registrando...' : 'Registro' }}
            </button>
        </form>

        <p class="text-center mt-3">
            ¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a>
        </p>
    </div>
</div>
